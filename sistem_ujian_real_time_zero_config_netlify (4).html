<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMP Negeri 4 Meukek - Portal Ujian Online</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Mammoth.js for Word (.docx) Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white !important; color: black !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Header / Nav -->
  <header class="bg-indigo-950 text-white shadow-md sticky top-0 z-50 no-print border-b border-indigo-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateHome()">
        <div class="bg-white text-indigo-950 p-2 rounded-xl font-extrabold text-xl shadow flex items-center justify-center w-10 h-10">
          <i class="fa-solid fa-school"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg leading-tight tracking-tight">Portal Ujian SMP Negeri 4 Meukek</h1>
          <p class="text-[11px] text-indigo-200">Sistem Ujian Online Real-Time & Live Scoring</p>
        </div>
      </div>

      <!-- Right Nav Section -->
      <div id="navRightSection" class="flex items-center space-x-3">
        <!-- Dynamic via JS -->
      </div>
    </div>
  </header>

  <!-- Main Content Render Container -->
  <main id="appContainer" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <!-- View Dynamic Content -->
  </main>

  <!-- Toast Notification -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none no-print"></div>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 no-print">
    <div class="max-w-7xl mx-auto px-4">
      <p>© 2026 <strong>SMP Negeri 4 Meukek</strong>. Portal Ujian Digital & Sistem Evaluasi Terintegrasi.</p>
    </div>
  </footer>

  <!-- Autonomous Real-Time Engine (Zero-Config Netlify Ready) -->
  <script>
    // Application State
    window.appState = {
      user: null,
      userProfile: null,
      role: null,
      studentInfo: null,
      currentExam: null,
      userAnswers: {},
      flaggedQuestions: {},
      examTimerInterval: null,
      activeHeartbeatInterval: null,
      timeLeft: 0,
      activeQuestionIndex: 0
    };

    // Shared LocalStorage & Multi-Tab Real-Time Broadcast Sync Engine
    const SYNC_CHANNEL_NAME = 'smpn4meukek_realtime_sync';
    const broadcastChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(SYNC_CHANNEL_NAME) : null;

    // Enhanced Safe LocalStorage Database Engine with Schema Integrity Guard
    function loadLocalStore(key, defaultValue) {
      try {
        const val = localStorage.getItem('smpn4_' + key);
        if (!val) return defaultValue;
        const parsed = JSON.parse(val);
        if (parsed && typeof parsed === 'object') {
          return parsed;
        }
        return defaultValue;
      } catch (e) {
        console.warn(`[Database Repair] Corrupted data on key 'smpn4_${key}', restoring fallback.`);
        return defaultValue;
      }
    }

    function saveLocalStore(key, data) {
      try {
        localStorage.setItem('smpn4_' + key, JSON.stringify(data));
        if (broadcastChannel) {
          broadcastChannel.postMessage({ type: 'SYNC_UPDATE', storeKey: key, payload: data });
        }
      } catch (e) {
        console.error("[Database Error] Storage quota or write failure:", e);
      }
    }

    // Default Seed Data & Database Initialization
    const defaultAdminCreds = { email: 'admin@smpn4meukek.sch.id', password: 'admin123' };
    window.adminCredentials = loadLocalStore('admin_creds', defaultAdminCreds);

    window.localExamsStore = loadLocalStore('exams', {});
    window.localResultsStore = loadLocalStore('results', {});
    window.localActiveSessionsStore = loadLocalStore('active_sessions', {});
    window.localTeachersStore = loadLocalStore('teachers', {
      'admin-default': {
        uid: 'admin-default',
        email: window.adminCredentials.email,
        name: 'Administrator Utama',
        role: 'admin',
        subject: 'Semua Mata Pelajaran'
      }
    });

    window.localStudentsStore = loadLocalStore('students', {
      '1001': { nis: '1001', name: 'Ahmad Raihan', class: 'VII A' },
      '1002': { nis: '1002', name: 'Siti Rahmah', class: 'VII B' }
    });

    // Database Utilities & Clean-up
    window.exportFullDatabase = () => {
      const dbBackup = {
        admin_creds: loadLocalStore('admin_creds', defaultAdminCreds),
        teachers: loadLocalStore('teachers', {}),
        students: loadLocalStore('students', {}),
        exams: loadLocalStore('exams', {}),
        results: loadLocalStore('results', {}),
        active_sessions: loadLocalStore('active_sessions', {}),
        exportedAt: new Date().toISOString()
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dbBackup, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Backup_DB_SMPN4Meukek_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("Cadangan Database berhasil diunduh!", "success");
    };

    window.importFullDatabase = (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const importedDB = JSON.parse(e.target.result);
          if (importedDB.admin_creds) saveLocalStore('admin_creds', importedDB.admin_creds);
          if (importedDB.teachers) saveLocalStore('teachers', importedDB.teachers);
          if (importedDB.students) saveLocalStore('students', importedDB.students);
          if (importedDB.exams) saveLocalStore('exams', importedDB.exams);
          if (importedDB.results) saveLocalStore('results', importedDB.results);
          if (importedDB.active_sessions) saveLocalStore('active_sessions', importedDB.active_sessions);

          window.adminCredentials = loadLocalStore('admin_creds', defaultAdminCreds);
          window.localTeachersStore = loadLocalStore('teachers', {});
          window.localStudentsStore = loadLocalStore('students', {});
          window.localExamsStore = loadLocalStore('exams', {});
          window.localResultsStore = loadLocalStore('results', {});
          window.localActiveSessionsStore = loadLocalStore('active_sessions', {});

          showToast("Database berhasil dipulihkan dari file backup!", "success");
          if (window.appState.role === 'admin') renderAdminDashboard();
        } catch (err) {
          showToast("File backup database tidak valid!", "error");
        }
      };
      reader.readAsText(file);
    };

    window.resetFullDatabase = () => {
      if (!confirm("APAKAH ANDA YAKIN? Seluruh data guru, murid, dan soal akan dikembalikan ke setelan awal pabrik!")) return;
      localStorage.clear();
      location.reload();
    };

    // Real-Time Active Exam Heartbeat for Students
    function sendStudentSessionHeartbeat() {
      if (window.appState.role !== 'siswa' || !window.appState.currentExam || !window.appState.studentInfo) return;
      const examCode = window.appState.currentExam.code;
      const nis = window.appState.studentInfo.nis;
      const key = `${examCode}_${nis}`;

      const sessionObj = {
        examCode: examCode,
        examTitle: window.appState.currentExam.title,
        nis: nis,
        name: window.appState.studentInfo.name,
        class: window.appState.studentInfo.class || 'Umum',
        currentQuestionIndex: window.appState.activeQuestionIndex || 0,
        answeredCount: Object.keys(window.appState.userAnswers).length,
        totalQuestions: window.appState.currentExam.questions.length,
        lastHeartbeat: new Date().getTime(),
        status: 'Sedang Mengerjakan'
      };

      window.localActiveSessionsStore[key] = sessionObj;
      saveLocalStore('active_sessions', window.localActiveSessionsStore);
    }

    function removeStudentSession() {
      if (window.appState.activeHeartbeatInterval) {
        clearInterval(window.appState.activeHeartbeatInterval);
        window.appState.activeHeartbeatInterval = null;
      }
      if (window.appState.currentExam && window.appState.studentInfo) {
        const key = `${window.appState.currentExam.code}_${window.appState.studentInfo.nis}`;
        delete window.localActiveSessionsStore[key];
        saveLocalStore('active_sessions', window.localActiveSessionsStore);
      }
    }

    // Broadcast Handlers
    if (broadcastChannel) {
      broadcastChannel.onmessage = (event) => {
        if (event.data && event.data.type === 'SYNC_UPDATE') {
          const { storeKey, payload } = event.data;
          if (storeKey === 'exams') window.localExamsStore = payload || {};
          if (storeKey === 'results') window.localResultsStore = payload || {};
          if (storeKey === 'active_sessions') window.localActiveSessionsStore = payload || {};
          if (storeKey === 'teachers') window.localTeachersStore = payload || {};
          if (storeKey === 'students') window.localStudentsStore = payload || {};
          if (storeKey === 'admin_creds') window.adminCredentials = payload || defaultAdminCreds;

          // Live Refresh Views if currently monitoring
          if (window.appState.role === 'admin') {
            renderAdminDashboardStats();
            if (document.getElementById('liveMonitorViewContainer')) {
              renderLiveMonitorView(document.getElementById('liveMonitorExamCode')?.value || 'ALL');
            }
          } else if (window.appState.role === 'guru') {
            if (document.getElementById('liveMonitorViewContainer')) {
              renderLiveMonitorView(document.getElementById('liveMonitorExamCode')?.value || 'ALL');
            }
          }
        }
      };
    }

    window.addEventListener('storage', (e) => {
      if (e.key && e.key.startsWith('smpn4_')) {
        window.localExamsStore = loadLocalStore('exams', {});
        window.localResultsStore = loadLocalStore('results', {});
        window.localActiveSessionsStore = loadLocalStore('active_sessions', {});
        window.localTeachersStore = loadLocalStore('teachers', {});
        window.localStudentsStore = loadLocalStore('students', {});

        if (document.getElementById('liveMonitorViewContainer')) {
          renderLiveMonitorView(document.getElementById('liveMonitorExamCode')?.value || 'ALL');
        }
      }
    });

    // Dynamic Admin Dashboard Global Stats Counter
    window.renderAdminDashboardStats = () => {
      const examsCount = Object.keys(window.localExamsStore).length;
      const teachersCount = Object.values(window.localTeachersStore).filter(t => t.role !== 'admin').length;
      const studentsCount = Object.keys(window.localStudentsStore).length;
      const results = Object.values(window.localResultsStore);

      const elExams = document.getElementById('statTotalExams');
      const elTeachers = document.getElementById('statTotalTeachers');
      const elStudents = document.getElementById('statTotalStudents');
      const elAvg = document.getElementById('statAvgScore');

      if (elExams) elExams.innerText = examsCount;
      if (elTeachers) elTeachers.innerText = teachersCount;
      if (elStudents) elStudents.innerText = studentsCount;

      if (elAvg) {
        if (results.length > 0) {
          const avg = Math.round(results.reduce((sum, r) => sum + r.score, 0) / results.length);
          elAvg.innerText = avg;
        } else {
          elAvg.innerText = "0";
        }
      }
    };

    window.showToast = (msg, type = "info") => {
      const toastContainer = document.getElementById('toastContainer');
      if (!toastContainer) return;
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
      toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center space-x-2 transition-all transform translate-y-2 opacity-100 pointer-events-auto`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info'}"></i><span>${msg}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    };

    function renderNav() {
      const container = document.getElementById('navRightSection');
      if (!container) return;

      let html = '';
      if (window.appState.userProfile) {
        const profile = window.appState.userProfile;
        const isAdmin = profile.role === 'admin';
        const badgeBg = isAdmin ? 'bg-rose-700 text-rose-100 border-rose-600' : 'bg-indigo-800 text-indigo-100 border-indigo-700';
        const roleIcon = isAdmin ? 'fa-user-shield' : 'fa-user-tie';
        const roleTitle = isAdmin ? 'SUPER ADMIN' : `Guru (${profile.subject || 'Mapel'})`;

        html = `
          <div class="flex items-center space-x-3">
            <span class="text-xs ${badgeBg} px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5 border shadow-sm">
              <i class="fa-solid ${roleIcon}"></i> ${roleTitle}: ${profile.name || profile.email}
            </span>
            <button onclick="handleLogout()" class="text-xs bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-lg transition font-semibold border border-slate-700">
              <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
          </div>
        `;
      } else if (window.appState.role === 'siswa') {
        html = `
          <span class="text-xs bg-indigo-800 text-indigo-100 px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5 border border-indigo-700">
            <i class="fa-solid fa-user-graduate"></i> Siswa: ${window.appState.studentInfo?.name || 'Peserta'}
          </span>
        `;
      } else {
        html = `
          <div class="flex gap-2">
            <button onclick="renderGuruAuthModal('login')" class="text-xs bg-indigo-900 hover:bg-indigo-800 text-white px-3.5 py-1.5 rounded-lg transition font-semibold border border-indigo-700 flex items-center gap-1.5">
              <i class="fa-solid fa-chalkboard-user"></i> Portal Guru
            </button>
            <button onclick="renderAdminAuthModal()" class="text-xs bg-rose-700 hover:bg-rose-800 text-white px-3 py-1.5 rounded-lg transition font-semibold border border-rose-600 flex items-center gap-1.5">
              <i class="fa-solid fa-user-shield"></i> Login Admin
            </button>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    // Admin & Student Operations with Instant Local Storage Realtime Sync
    window.handleAddStudentSubmit = (e) => {
      e.preventDefault();
      const nis = document.getElementById('admStudentNis').value.trim();
      const name = document.getElementById('admStudentName').value.trim();
      const studentClass = document.getElementById('admStudentClass').value.trim();

      if (!nis || !name) {
        showToast("NIS dan Nama Murid wajib diisi!", "error");
        return;
      }

      const studentObj = { nis, name, class: studentClass || 'Umum', addedAt: new Date().toISOString() };
      window.localStudentsStore[nis] = studentObj;
      saveLocalStore('students', window.localStudentsStore);

      showToast(`Murid ${name} (NIS: ${nis}) berhasil didaftarkan secara Real-Time!`, "success");
      e.target.reset();
      renderAdminStudentsList();
      renderAdminDashboardStats();
    };

    window.handleAddTeacherSubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById('admTeacherName').value.trim();
      const subject = document.getElementById('admTeacherSubject').value.trim();
      const email = document.getElementById('admTeacherEmail').value.trim();
      const password = document.getElementById('admTeacherPassword').value.trim();

      if (!name || !subject || !email || !password) {
        showToast("Seluruh bidang form guru wajib diisi!", "error");
        return;
      }

      const uid = 'guru-' + Date.now();
      const teacherObj = { uid, email, password, name, subject, role: 'guru' };

      window.localTeachersStore[uid] = teacherObj;
      saveLocalStore('teachers', window.localTeachersStore);

      showToast(`Akun Guru (${name} - ${subject}) berhasil dibuat & ter-update Real-Time!`, "success");
      e.target.reset();
      renderAdminTeachersList();
      renderAdminDashboardStats();
    };

    window.handleDeleteStudent = (nis) => {
      if (!confirm(`Hapus data murid dengan NIS ${nis}?`)) return;
      delete window.localStudentsStore[nis];
      saveLocalStore('students', window.localStudentsStore);
      showToast("Data murid berhasil dihapus", "success");
      renderAdminStudentsList();
      renderAdminDashboardStats();
    };

    window.handleDeleteTeacher = (uid) => {
      if (!confirm("Hapus akun guru ini dari sistem?")) return;
      delete window.localTeachersStore[uid];
      saveLocalStore('teachers', window.localTeachersStore);
      showToast("Akun guru berhasil dihapus", "success");
      renderAdminTeachersList();
      renderAdminDashboardStats();
    };

    window.submitStudentExam = () => {
      if (window.appState.examTimerInterval) {
        clearInterval(window.appState.examTimerInterval);
        window.appState.examTimerInterval = null;
      }

      const exam = window.appState.currentExam;
      const answers = window.appState.userAnswers;
      const questions = exam.questions;

      let correctCount = 0;
      questions.forEach((q, idx) => {
        if (answers[idx] === q.key) correctCount++;
      });

      const score = Math.round((correctCount / questions.length) * 100);
      const resultObj = {
        examCode: exam.code,
        studentName: window.appState.studentInfo.name,
        studentNis: window.appState.studentInfo.nis,
        score: score,
        correctCount: correctCount,
        totalQuestions: questions.length,
        timestamp: new Date().toISOString()
      };

      const resId = `${exam.code}_${window.appState.studentInfo.nis}`;
      window.localResultsStore[resId] = resultObj;
      saveLocalStore('results', window.localResultsStore);

      renderStudentResultPage(resultObj);
    };

    // Navigation and Page Initializer
    window.navigateHome = () => {
      if (window.appState.role === 'admin') renderAdminDashboard();
      else if (window.appState.role === 'guru') renderGuruDashboard();
      else renderPortalSelection();
    };

    // --- UI Renderers & Views ---
    window.renderPortalSelection = () => {
      window.appState.role = null;
      window.appState.userProfile = null;
      renderNav();

      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-8 py-4">
          <div class="text-center space-y-2">
            <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">SMP Negeri 4 Meukek</span>
            <h2 class="text-3xl font-extrabold text-slate-900">Portal Ujian Online & CBT</h2>
            <p class="text-slate-600 text-sm max-w-lg mx-auto">Silakan pilih jenis portal di bawah ini untuk memulai atau mengelola ujian online sekolah.</p>
          </div>

          <div class="grid md:grid-cols-3 gap-6">
            <!-- Portal Siswa -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:shadow-md transition">
              <div class="space-y-4">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-700 rounded-xl flex items-center justify-center text-xl font-bold">
                  <i class="fa-solid fa-user-graduate"></i>
                </div>
                <div>
                  <h3 class="font-bold text-lg text-slate-900">Portal Siswa</h3>
                  <p class="text-xs text-slate-500 mt-1">Masuk untuk mengerjakan ujian online menggunakan Kode Ujian dari Guru.</p>
                </div>
              </div>
              <button onclick="renderStudentLoginForm()" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">
                Masuk Kerjakan Ujian <i class="fa-solid fa-arrow-right ml-1"></i>
              </button>
            </div>

            <!-- Portal Guru Mapel -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:shadow-md transition">
              <div class="space-y-4">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-xl flex items-center justify-center text-xl font-bold">
                  <i class="fa-solid fa-chalkboard-user"></i>
                </div>
                <div>
                  <h3 class="font-bold text-lg text-slate-900">Portal Guru Mapel</h3>
                  <p class="text-xs text-slate-500 mt-1">Kelola bank soal, publikasikan ujian, dan lihat rekap nilai siswa secara real-time.</p>
                </div>
              </div>
              <button onclick="renderGuruAuthModal('login')" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">
                Login Guru Mapel <i class="fa-solid fa-arrow-right ml-1"></i>
              </button>
            </div>

            <!-- Portal Admin -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:shadow-md transition">
              <div class="space-y-4">
                <div class="w-12 h-12 bg-rose-100 text-rose-700 rounded-xl flex items-center justify-center text-xl font-bold">
                  <i class="fa-solid fa-user-shield"></i>
                </div>
                <div>
                  <h3 class="font-bold text-lg text-slate-900">Portal Admin</h3>
                  <p class="text-xs text-slate-500 mt-1">Kelola data murid (whitelist), buat akun guru mapel, dan pantau rekap sekolah.</p>
                </div>
              </div>
              <button onclick="renderAdminAuthModal()" class="mt-6 w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">
                Login Admin <i class="fa-solid fa-arrow-right ml-1"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    };

    window.renderStudentLoginForm = () => {
      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
          <div class="text-center">
            <h3 class="text-xl font-bold text-slate-900">Masuk Ujian Siswa</h3>
            <p class="text-xs text-slate-500 mt-1">Masukkan data diri dan Kode Akses Ujian dari Guru.</p>
          </div>
          <form onsubmit="handleStartExamSubmit(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Kode Akses Ujian</label>
              <input type="text" id="stdExamCode" required uppercase placeholder="Contoh: IPA7A" class="w-full px-3.5 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none uppercase font-bold tracking-wider">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">NIS (Nomor Induk Siswa)</label>
              <input type="text" id="stdNis" required placeholder="Contoh: 1001" class="w-full px-3.5 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              <p class="text-[10px] text-amber-600 mt-1"><i class="fa-solid fa-info-circle"></i> NIS wajib sudah terdaftar oleh Admin Sekolah.</p>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap Siswa</label>
              <input type="text" id="stdName" required placeholder="Nama Anda" class="w-full px-3.5 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">

      removeStudentSession();

      const exam = window.appState.currentExam;
      const answers = window.appState.userAnswers;
      const questions = exam.questions;

      let correctCount = 0;
      const detailedAnswers = {};

      questions.forEach((q, idx) => {
        const studentAns = answers[idx] || '-';
        detailedAnswers[idx + 1] = {
          question: q.question,
          selected: studentAns,
          correct: q.key,
          isCorrect: studentAns === q.key
        };
        if (studentAns === q.key) correctCount++;
      });

      const score = Math.round((correctCount / questions.length) * 100);
      const resultObj = {
        examCode: exam.code,
        examTitle: exam.title,
        subject: exam.subject,
        studentName: window.appState.studentInfo.name,
        studentNis: window.appState.studentInfo.nis,
        studentClass: window.appState.studentInfo.class || 'Umum',
        score: score,
        correctCount: correctCount,
        totalQuestions: questions.length,
        answers: detailedAnswers,
        timestamp: new Date().toISOString()
      };

      const resId = `${exam.code}_${window.appState.studentInfo.nis}`;

      renderStudentResultPage(resultObj);

    window.onload = () => {
      renderPortalSelection();
    };
  </script>
